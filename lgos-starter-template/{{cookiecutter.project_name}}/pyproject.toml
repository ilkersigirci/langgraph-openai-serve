[project]
name = {{ cookiecutter.project_name | tojson }}
version = "0.1.0"
description = {{ cookiecutter.project_description | tojson }}
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version }},<3.15"
{% if cookiecutter.license == 'MIT' %}
license = "MIT"
{% endif %}
authors = [{ name = {{ cookiecutter.author | tojson }}, email = {{ cookiecutter.email | tojson }} }]
dependencies = [
    "langchain-openai>=1.6.6",
    "langgraph-openai-serve[server]>=0.29.0,<0.30",
    "pydantic-settings>=2.9,<3",
]

[dependency-groups]
dev = ["prek>=0.3.11", "ruff>=0.16.10,<0.17", "ty>=0.0.84"]
test = [
    "anyio>=4.14,<5",
    "httpx2>=2.13,<3",
    "pytest>=9,<10",
    "pytest-cov>=5",
    "pytest-env>=1.6",
    "pytest-xdist>=3.6",
]
doc = ["zensical>=0.0.68,<0.1"]

[tool.uv]
default-groups = ["dev", "test", "doc"]

[tool.pytest.ini_options]
anyio_mode = "auto"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
env = ["LGOS_ENABLE_LANGFUSE=False"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = {{ cookiecutter.project_slug | tojson }}
