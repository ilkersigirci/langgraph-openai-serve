[project]
name = {{ cookiecutter.project_name | tojson }}
version = "0.1.0"
description = {{ cookiecutter.project_description | tojson }}
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version }},<3.15"
{% if cookiecutter.license == 'MIT' %}
license = "MIT"
license-files = ["LICENSE"]
{% else %}
# PyPI rejects this classifier, so the package cannot be published by accident.
classifiers = ["Private :: Do Not Upload"]
{% endif %}
authors = [{ name = {{ cookiecutter.author | tojson }}, email = {{ cookiecutter.email | tojson }} }]
dependencies = [
    "langchain-core>=1.6.6,<2",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.6,<2",
    "langgraph-openai-serve[server]>=0.29.0,<0.30",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
]

[dependency-groups]
dev = [
    "prek>=0.3.11",
    "ruff>=0.16.10,<0.17",
    "ty>=0.0.84",
    # Without it, `just run --reload` rescans every file several times a second.
    "watchfiles>=1.3.0",
]
test = [
    "anyio>=4.14,<5",
    "fastapi>=0.142.2",
    "httpx2>=2.13,<3",
    "openai>=3.20,<4",
    "pytest>=9,<10",
    "pytest-env>=1.6",
    "pytest-xdist>=3.6",
]
doc = ["zensical>=0.0.68,<0.1"]

[tool.uv]
default-groups = ["dev", "test", "doc"]

[tool.pytest.ini_options]
anyio_mode = "auto"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
# Settings load `.env` on import. Tests inject a fake model and need no real key.
env = ["APP_OPENAI_API_KEY=test", "LGOS_ENABLE_LANGFUSE=False"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = {{ cookiecutter.project_slug | tojson }}
