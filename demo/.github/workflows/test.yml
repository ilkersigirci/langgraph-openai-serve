---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Test demo projects

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose:
    name: Validate Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Render all Compose models
        run: |
          cp .env.example .env
          export OTEL_COLLECTOR_GATEWAY_ENDPOINT=https://otel-gateway.example.internal
          export OTEL_HOST_NAME=github-actions
          just compose-config

  test:
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            directory: api
          - name: Files API
            directory: files_api
          - name: Chainlit
            directory: ui/chainlit_ui
          - name: Open WebUI
            directory: ui/openwebui
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check project
        uses: ./.github/actions/check-project
        with:
          directory: ${{ matrix.directory }}
          cache-dependency-glob: ${{ matrix.directory }}/uv.lock
          verify-api-corpus: ${{ matrix.name == 'API' }}
