[project]
name = "lgos-demo-api"
version = "0.1.0"
description = "Standalone demo API for langgraph-openai-serve"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.15"
dependencies = [
    "httpx2>=2.13,<3",
    "langchain-openai>=1.6.6",
    "langchain-text-splitters>=1.1.0",
    "langgraph-openai-serve[server]>=0.29.0rc1",
    "numpy>=2.4.6",
    "plotly>=6,<7",
]

[project.scripts]
lgos-demo-api-sync-litellm = "lgos_demo_api.utils.sync_litellm:main"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.84",
    "marimo>=0.24.0",
    "polars>=1.9.0",
    "sqlalchemy>=2.0,<3",
    "pydantic-ai-slim[openai]>=1.107.0,<3.0.0",
]
test = [
    "langgraph-checkpoint-sqlite>=3.1.0,<4",
    "mcp>=2,<3",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "pytest-env>=1.6.0",
    "pytest-xdist>=3.6.1",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.pytest.ini_options]
minversion = "8.3.3"
anyio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--color=yes",
    "--strict-config",
    "--strict-markers",
    "-m",
    "not integration",
]
env = [
    "ENVIRONMENT=test",
    "LANGGRAPH_STRICT_MSGPACK=False",
    "LGOS_ENABLE_LANGFUSE=False",
]
testpaths = ["tests"]
markers = [
    "integration: requires explicitly started external demo services",
]

[tool.ruff]
extend = "../ruff.toml"
src = ["src", "tests"]

[tool.ruff.lint.extend-per-file-ignores]
"notebooks/*.py" = [
    "print", # Notebook cells display client responses on stdout.
    # Marimo generates cell signatures, names, and explicit returns from its DAG.
    "ANN",
    "invalid-argument-name",
    "non-lowercase-variable-in-function",
    "too-many-arguments",
    "too-many-positional-arguments",
    "useless-return",
    "used-dummy-variable",
    "implicit-namespace-package",
    "f-string-missing-placeholders", # SQL cells use f-strings for reactive interpolation.
]

###### MARIMO START #######

# Lines marked "Non-default" intentionally override marimo defaults.
[tool.marimo.ai]
enabled = true

[tool.marimo.ai.models]
chat_model = "aigateway/openai/gpt-5.4-mini" # Non-default: explicit model selection
custom_models = []
displayed_models = []
edit_model = "aigateway/openai/gpt-5.4-mini" # Non-default: explicit model selection

[tool.marimo.completion]
activate_on_typing = true
auto_close_pairs = true
copilot = false
signature_hint_on_typing = false

[tool.marimo.diagnostics]
sql_linter = true

[tool.marimo.display]
cell_output = "below"
code_editor_font_size = 14
dataframes = "rich"
default_table_max_columns = 50
default_table_page_size = 10
default_width = "medium"
reference_highlighting = true
theme = "light"

[tool.marimo.experimental]
external_agents = true # Non-default: enables experimental agent support

[tool.marimo.formatting]
line_length = 88

[tool.marimo.keymap]
preset = "default"

[tool.marimo.keymap.overrides]

[tool.marimo.language_servers.pylsp]
enable_flake8 = false
enable_mypy = true
enable_pydocstyle = false
enable_pyflakes = false
enable_pylint = false
enable_ruff = true
enabled = false

[tool.marimo.language_servers.ty]
enabled = true # Non-default: enables ty diagnostics

[tool.marimo.mcp]
presets = []

[tool.marimo.mcp.mcpServers]

[tool.marimo.package_management]
manager = "uv" # Explicit pin; otherwise inferred

[tool.marimo.runtime]
auto_instantiate = false
auto_reload = "off"
default_csv_encoding = "utf-8"
default_sql_output = "auto"
on_cell_change = "autorun"
output_max_bytes = 8000000
reactive_tests = true
show_tracebacks = false
std_stream_max_bytes = 1000000
watcher_on_save = "lazy"

[tool.marimo.save]
autosave = "after_delay"
autosave_delay = 1000
format_on_save = true

[tool.marimo.server]
browser = "default"
follow_symlink = false

[tool.marimo.snippets]
custom_paths = []
include_default_snippets = true

###### MARIMO END #######

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.23,<0.13"]
