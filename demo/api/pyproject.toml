[project]
name = "lgos-demo-api"
version = "0.1.0"
description = "Standalone demo API for langgraph-openai-serve"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi[standard]>=0.121.0",
    "langchain>=1.2.0",
    "langchain-openai>=1.2.1",
    "langchain-text-splitters>=1.1.0",
    "langgraph>=1.1.10,<2.0.0",
    "langgraph-checkpoint-postgres>=3.1.0,<4",
    "langgraph-openai-serve[tracing]>=0.10.1",
    "numpy>=2.4.6",
    "opentelemetry-distro>=0.65b0,<0.66",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0,<2",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<0.66",
    "opentelemetry-instrumentation-httpx>=0.65b0,<0.66",
    "opentelemetry-instrumentation-logging>=0.65b0,<0.66",
    "opentelemetry-instrumentation-psycopg>=0.65b0,<0.66",
    "plotly>=6,<7",
    "psycopg[binary,pool]>=3.3.4,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9.0",
    "structlog>=26.1.0,<27",
]

[project.scripts]
lgos-demo-api = "lgos_demo_api.app:main"
lgos-demo-api-setup = "lgos_demo_api.setup_checkpointer:main"

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "ty>=0.0.72",
    "marimo>=0.24.0",
    "polars>=1.9.0",
    "sqlalchemy>=2.0,<3",
    "pydantic-ai-slim[openai]>=1.107.0,<3.0.0",
]
test = [
    "anyio>=4.14,<5",
    "httpx>=0.28.0",
    "langgraph-checkpoint-sqlite>=3.1.0,<4",
    "openai>=2.0.0,<3.0.0",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "pytest-env>=1.6.0",
    "pytest-xdist>=3.6.1",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.pytest.ini_options]
minversion = "8.3.3"
anyio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--color=yes",
    "--strict-config",
    "--strict-markers",
    "-m",
    "not integration",
]
env = [
    "ENVIRONMENT=test",
    "LGOS_ENABLE_LANGFUSE=False",
]
testpaths = ["tests"]
markers = [
    "integration: requires explicitly started external demo services",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PIE", "PTH", "RUF", "SIM", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = [
    "F541", # Marimo serializes SQL cells as f-strings for reactive interpolation.
]

###### MARIMO START #######

# Lines marked "Non-default" intentionally override marimo defaults.
[tool.marimo.ai]
enabled = true

[tool.marimo.ai.models]
chat_model = "aigateway/openai/gpt-5.4-mini" # Non-default: explicit model selection
custom_models = []
displayed_models = []
edit_model = "aigateway/openai/gpt-5.4-mini" # Non-default: explicit model selection

[tool.marimo.completion]
activate_on_typing = true
auto_close_pairs = true
copilot = false
signature_hint_on_typing = false

[tool.marimo.diagnostics]
sql_linter = true

[tool.marimo.display]
cell_output = "below"
code_editor_font_size = 14
dataframes = "rich"
default_table_max_columns = 50
default_table_page_size = 10
default_width = "medium"
reference_highlighting = true
theme = "light"

[tool.marimo.experimental]
external_agents = true # Non-default: enables experimental agent support

[tool.marimo.formatting]
line_length = 88

[tool.marimo.keymap]
preset = "default"

[tool.marimo.keymap.overrides]

[tool.marimo.language_servers.pylsp]
enable_flake8 = false
enable_mypy = true
enable_pydocstyle = false
enable_pyflakes = false
enable_pylint = false
enable_ruff = true
enabled = false

[tool.marimo.language_servers.ty]
enabled = true # Non-default: enables ty diagnostics

[tool.marimo.mcp]
presets = []

[tool.marimo.mcp.mcpServers]

[tool.marimo.package_management]
manager = "uv" # Explicit pin; otherwise inferred

[tool.marimo.runtime]
auto_instantiate = false
auto_reload = "off"
default_csv_encoding = "utf-8"
default_sql_output = "auto"
on_cell_change = "autorun"
output_max_bytes = 8000000
reactive_tests = true
show_tracebacks = false
std_stream_max_bytes = 1000000
watcher_on_save = "lazy"

[tool.marimo.save]
autosave = "after_delay"
autosave_delay = 1000
format_on_save = true

[tool.marimo.server]
browser = "default"
follow_symlink = false

[tool.marimo.snippets]
custom_paths = []
include_default_snippets = true

###### MARIMO END #######

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.1,<0.13"]
