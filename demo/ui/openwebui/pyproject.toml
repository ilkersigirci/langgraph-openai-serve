[project]
name = "lgos-openwebui"
version = "0.1.0"
description = "Open WebUI integration and synchronization command for LGOS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.15"
dependencies = [
    "httpx>=0.28,<1",
    "httpx2>=2.13,<3",
    "openai>=3.14.1,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9.0",
]

[project.scripts]
lgos-openwebui-sync = "lgos_openwebui.sync_functions:main"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.84",
]
test = [
    "anyio>=4.14,<5",
    "pytest>=8.3.3",
    "pytest-xdist>=3.6.1",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.pytest.ini_options]
minversion = "8.3.3"
anyio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--color=yes",
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]

[tool.ruff]
extend = "../../ruff.toml"
src = ["src", "tests"]

[tool.ruff.lint.extend-per-file-ignores]
# Open WebUI parses these module docstrings as frontmatter, including the title.
"src/lgos_openwebui/functions/generic/function.py" = [
    "missing-trailing-period",
    "missing-terminal-punctuation",
]
"src/lgos_openwebui/functions/uservalves_simple.py" = [
    "missing-blank-line-after-summary",
]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.23,<0.13"]
