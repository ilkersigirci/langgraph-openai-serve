[project]
name = "lgos-openwebui"
version = "0.1.0"
description = "Open WebUI integration for LGOS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.15"
# This code runs on the pinned Open WebUI image's packages; keep these equal to
# the versions that image ships so the tests run what the image runs.
dependencies = [
    "httpx==0.28.1",
    "openai==2.29.0",
    "pydantic==2.13.4",
]

[project.scripts]
lgos-openwebui-sync = "lgos_openwebui.sync:main"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.84",
]
test = [
    "anyio>=4.14,<5",
    "pytest>=8.3.3",
    "pytest-xdist>=3.6.1",
    # Serves the in-process Open WebUI API that the sync tests call.
    "starlette>=1.7.0",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.pytest.ini_options]
minversion = "8.3.3"
anyio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--color=yes",
    "--strict-config",
    "--strict-markers",
    "-m",
    "not integration",
]
testpaths = ["tests"]
markers = ["integration: requires the running demo Open WebUI and its gateway"]

[tool.ruff]
extend = "../../ruff.toml"
src = ["src", "tests"]

[tool.ruff.lint.extend-per-file-ignores]
# Open WebUI parses these module docstrings as frontmatter, including the title.
"src/lgos_openwebui/functions/generic/function.py" = [
    "missing-trailing-period",
    "missing-terminal-punctuation",
]
"src/lgos_openwebui/functions/uservalves_simple.py" = [
    "missing-blank-line-after-summary",
]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.13.1,<0.14"]
