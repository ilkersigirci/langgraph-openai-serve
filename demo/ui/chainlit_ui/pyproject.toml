[project]
name = "lgos-chainlit"
version = "0.1.0"
description = "Standalone Chainlit client for an OpenAI-compatible LGOS endpoint"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.15"
dependencies = [
    "boto3>=1.43.75,<2",
    "chainlit>=2.11.1,<3",
    "chainlit-utils==0.1.0",
    "fastapi[standard]>=0.121.0",
    "openai>=2.0.0,<3.0.0",
    "opentelemetry-distro>=0.65b0,<0.66",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0,<2",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<0.66",
    "opentelemetry-instrumentation-httpx>=0.65b0,<0.66",
    "plotly>=6,<7",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9.0",
]

[project.scripts]
lgos-chainlit = "lgos_chainlit.main:run"
lgos-chainlit-setup = "chainlit_utils.database:main"

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "ty>=0.0.72",
]
test = [
    "anyio>=4.14,<5",
    "httpx>=0.28.0",
    "pytest>=8.3.3",
    "pytest-env>=1.6.0",
    "pytest-xdist>=3.6.1",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.pytest.ini_options]
minversion = "8.3.3"
anyio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--color=yes",
    "--strict-config",
    "--strict-markers",
]
env = [
    "CHAINLIT_ENV_FILE=__pytest_no_dotenv__",
    "BUCKET_NAME=lgos-chainlit-test",
    "APP_AWS_ACCESS_KEY=test-access-key",
    "APP_AWS_SECRET_KEY=test-secret-key",
    "APP_AWS_REGION=eu-west-1",
    "DEV_AWS_ENDPOINT=https://s3.example.com",
    "CHAINLIT_UTILS_MIGRATIONS_TABLE=_lgos_chainlit_schema_migrations",
    "CHAINLIT_UTILS_MODEL_CONTEXT_EXCLUDED_KEY=lgos_chainlit.exclude_from_model_context",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PIE", "PTH", "RUF", "SIM", "W"]
ignore = ["E501"]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.1,<0.13"]
