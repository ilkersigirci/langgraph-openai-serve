[project]
name = "lgos-api-coding-agent"
version = "0.1.0"
description = "Coding-agent showcase served through the LGOS OpenAI API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.142.2",
    "langgraph-openai-serve[tracing]>=0.27.0",
    "openai-codex>=0.159.0",
    "opentelemetry-distro>=0.66b0,<0.67",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.0,<2",
    "opentelemetry-instrumentation-logging>=0.66b0,<0.67",
    "pydantic-settings>=2.9.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
lgos-api-coding-agent = "lgos_api_coding_agent.app:main"

[dependency-groups]
dev = ["ruff>=0.16.10", "ty>=0.0.84"]
test = ["anyio>=4.14,<5", "httpx2>=2.13,<3", "pytest>=8.3.3", "pytest-env>=1.6.0"]

[tool.uv]
default-groups = ["dev", "test"]

[tool.pytest.ini_options]
anyio_mode = "auto"
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers", "-m", "not integration"]
env = ["LGOS_ENABLE_LANGFUSE=False"]
testpaths = ["tests"]
markers = ["integration: requires the coding-agent demo and a live gateway"]

[tool.ruff]
extend = "../ruff.toml"
src = ["src", "tests"]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.23,<0.13"]
