# Register database-backed LGOS models with the demo's sync-litellm command.
# The graph, embedding, and speech models below forward to the configured
# upstream, the OpenAI API by default, under the IDs Bifrost uses. Each sets
# api_base and api_key because this container's OPENAI_* defaults target the
# Files API. use_in_pass_through lends their key to /openai_passthrough, which
# serves the advanced graph's vector store.
model_list:
  - model_name: openai/gpt-6-luna
    litellm_params: &openai_upstream
      model: openai/gpt-6-luna
      api_base: os.environ/OPENAI_UPSTREAM_API_BASE
      api_key: os.environ/OPENAI_UPSTREAM_API_KEY
      use_in_pass_through: true
  - model_name: openai/gpt-4.1-mini
    litellm_params:
      <<: *openai_upstream
      model: openai/gpt-4.1-mini
  - model_name: openai/text-embedding-3-small
    litellm_params:
      <<: *openai_upstream
      model: openai/text-embedding-3-small
    model_info:
      mode: embedding
  - model_name: openai/gpt-4o-mini-transcribe
    litellm_params:
      <<: *openai_upstream
      model: openai/gpt-4o-mini-transcribe
    model_info:
      mode: audio_transcription
  - model_name: openai/gpt-4o-mini-tts
    litellm_params:
      <<: *openai_upstream
      model: openai/gpt-4o-mini-tts
    model_info:
      mode: audio_speech

mcp_servers:
  lgos_postgres:
    url: http://lgos-postgres-mcp:8080/mcp
    transport: http
    auth_type: bearer_token
    auth_value: os.environ/LGOS_MCP_AUTH_TOKEN
    allowed_tools:
      - count_chainlit_users
      - list_chainlit_conversation_counts
      - summarize_chainlit_activity
      - list_chainlit_activity_by_profile
      - summarize_lgos_interrupted_runs
      - list_lgos_interrupted_runs
    allow_all_keys: true

files_settings:
  - custom_llm_provider: litellm_proxy
    api_base: http://lgos-files-api:8000/v1
    api_key: DUMMY

litellm_settings:
  # Preserve the caller's W3C trace across the gateway-to-LGOS hop. LiteLLM
  # applies this to every model, so OpenAI API requests carry it too.
  forward_traceparent_to_llm_provider: true

# Keep Prometheus cardinality bounded to attributes LiteLLM always populates.
# The pinned release passes a null request model for some preflight and
# non-inference paths, which makes its OTLP encoder repeat an error for every
# cumulative export. Model names remain available on the model-call spans.
# Token type and error type are attached independently of this allowlist.
callback_settings:
  otel:
    attributes:
      include_list:
        - gen_ai.operation.name
        - gen_ai.provider.name
