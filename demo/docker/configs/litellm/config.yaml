# Register database-backed LGOS models with the demo's sync-litellm command.
# The speech models below forward to aigateway under the IDs Bifrost uses. Each
# sets api_base and api_key because this container's OPENAI_* defaults target
# the Files API; the leading `openai/` selects LiteLLM's OpenAI client.
model_list:
  - model_name: aigateway/openai/gpt-4o-mini-transcribe
    litellm_params:
      model: openai/openai/gpt-4o-mini-transcribe
      api_base: https://aigateway.home.ilkerflix.com/v1
      api_key: os.environ/AIGATEWAY_API_KEY
    model_info:
      mode: audio_transcription
  - model_name: aigateway/openai/gpt-4o-mini-tts
    litellm_params:
      model: openai/openai/gpt-4o-mini-tts
      api_base: https://aigateway.home.ilkerflix.com/v1
      api_key: os.environ/AIGATEWAY_API_KEY
    model_info:
      mode: audio_speech

mcp_servers:
  lgos_postgres:
    url: http://lgos-postgres-mcp:8080/mcp
    transport: http
    auth_type: bearer_token
    auth_value: os.environ/LGOS_MCP_AUTH_TOKEN
    allowed_tools:
      - count_chainlit_users
      - list_chainlit_conversation_counts
      - summarize_chainlit_activity
      - list_chainlit_activity_by_profile
      - summarize_lgos_interrupted_runs
      - list_lgos_interrupted_runs
    allow_all_keys: true

files_settings:
  - custom_llm_provider: litellm_proxy
    api_base: http://lgos-files-api:8000/v1
    api_key: DUMMY

litellm_settings:
  # Bundled models target LGOS on the private Compose network, so preserve the
  # caller's W3C trace across the gateway-to-API hop.
  forward_traceparent_to_llm_provider: true

# Keep Prometheus cardinality bounded to attributes LiteLLM always populates.
# The pinned release passes a null request model for some preflight and
# non-inference paths, which makes its OTLP encoder repeat an error for every
# cumulative export. Model names remain available on the model-call spans.
# Token type and error type are attached independently of this allowlist.
callback_settings:
  otel:
    attributes:
      include_list:
        - gen_ai.operation.name
        - gen_ai.provider.name
