# Optional OpenTelemetry deployment overlay.
#
# The upstream gateway is intentionally configured by environment rather than
# bundled into this demo. Applications send OTLP to this local Collector, which
# handles buffering and forwards signals to the remote gateway/backend over
# OTLP/HTTP.

networks:
  lgos-otel-ingest:
    internal: true
  lgos-otel-egress:

x-lgos-otel-environment: &lgos-otel-environment
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgos-otel-collector:4317
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  OTEL_TRACES_EXPORTER: otlp
  OTEL_PROPAGATORS: tracecontext
  OTEL_SEMCONV_STABILITY_OPT_IN: http
  # Preserve complete distributed traces; sampling is disabled for this demo.
  OTEL_TRACES_SAMPLER: always_on
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=$OTEL_SERVICE_NAMESPACE,deployment.environment.name=$OTEL_DEPLOYMENT_ENVIRONMENT

x-lgos-otel-server-environment: &lgos-otel-server-environment
  <<: *lgos-otel-environment
  OTEL_METRICS_EXPORTER: otlp
  # Export stdlib logging records through the same OTLP pipeline as traces and
  # metrics. The stdout handler remains available for container diagnostics.
  OTEL_LOGS_EXPORTER: otlp
  OTEL_PYTHON_LOG_AUTO_INSTRUMENTATION: "true"
  OTEL_PYTHON_LOG_CORRELATION: "true"
  OTEL_PYTHON_LOG_HANDLER_LEVEL: info

x-lgos-otel-python-environment: &lgos-otel-python-environment
  <<: *lgos-otel-environment
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none

services:
  lgos-otel-collector:
    container_name: lgos-otel-collector
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    restart: $RESTART_POLICY
    command: ["--config=/etc/otelcol/config.yaml"]
    user: "$PUID:$PGID"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=32m,uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: 1G
    networks:
      - lgos-otel-ingest
      - lgos-otel-egress
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    expose:
      - "4317"
      - "4318"
    volumes:
      - type: bind
        source: ../configs/otel-collector/config.yaml
        target: /etc/otelcol/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../volumes/otel-collector
        target: /var/lib/otelcol/file_storage
        bind:
          create_host_path: false
    environment:
      OTEL_COLLECTOR_GATEWAY_ENDPOINT: $OTEL_COLLECTOR_GATEWAY_ENDPOINT
      OTEL_SERVICE_NAMESPACE: $OTEL_SERVICE_NAMESPACE
      OTEL_DEPLOYMENT_ENVIRONMENT: $OTEL_DEPLOYMENT_ENVIRONMENT
      OTEL_HOST_NAME: $OTEL_HOST_NAME
      GOMEMLIMIT: 800MiB

  lgos-demo-api-a:
    networks:
      - default
      - lgos-otel-ingest
    environment:
      <<: *lgos-otel-server-environment
      OTEL_SERVICE_NAME: lgos-demo-api
    command: ["opentelemetry-instrument", "lgos-demo-api"]
    restart: $RESTART_POLICY
    depends_on:
      lgos-otel-collector:
        condition: service_started

  lgos-demo-api-b:
    networks:
      - default
      - lgos-otel-ingest
    environment:
      <<: *lgos-otel-server-environment
      OTEL_SERVICE_NAME: lgos-demo-api
    command: ["opentelemetry-instrument", "lgos-demo-api"]
    restart: $RESTART_POLICY
    depends_on:
      lgos-otel-collector:
        condition: service_started

  lgos-background-worker:
    networks:
      - default
      - lgos-otel-ingest
    environment:
      <<: *lgos-otel-server-environment
      OTEL_SERVICE_NAME: lgos-background-worker
    command: ["opentelemetry-instrument", "lgos-demo-background-worker"]
    restart: $RESTART_POLICY
    depends_on:
      lgos-otel-collector:
        condition: service_started

  lgos-files-api:
    networks:
      - default
      - lgos-otel-ingest
    environment:
      <<: *lgos-otel-server-environment
      OTEL_SERVICE_NAME: lgos-files-api
    command: ["opentelemetry-instrument", "lgos-files-api"]
    restart: $RESTART_POLICY
    depends_on:
      lgos-otel-collector:
        condition: service_started

  lgos-chainlit:
    networks:
      - default
      - lgos-otel-ingest
    environment:
      <<: *lgos-otel-python-environment
      OTEL_SERVICE_NAME: lgos-chainlit
      # Chainlit transitively installs GenAI instrumentors that record prompt
      # content. HTTPX2 remains enabled for propagation and transport tracing.
      OTEL_PYTHON_DISABLED_INSTRUMENTATIONS: openai,openai_agents
    command: ["opentelemetry-instrument", "lgos-chainlit"]
    depends_on:
      lgos-otel-collector:
        condition: service_started

  lgos-openwebui:
    networks:
      - default
      - lgos-otel-ingest
    environment:
      <<: *lgos-otel-environment
      ENABLE_OTEL: "true"
      ENABLE_OTEL_TRACES: "true"
      ENABLE_OTEL_METRICS: "false"
      ENABLE_OTEL_LOGS: "false"
      OTEL_SERVICE_NAME: lgos-openwebui
      # Open WebUI instruments FastAPI with the contrib instrumentor.
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: /health$
    depends_on:
      lgos-otel-collector:
        condition: service_started

  lgos-bifrost:
    networks:
      - default
      - lgos-otel-ingest
    depends_on:
      lgos-otel-collector:
        condition: service_started

  lgos-litellm:
    networks:
      - default
      - lgos-otel-ingest
    environment:
      <<: *lgos-otel-environment
      LITELLM_OTEL_V2: "true"
      LITELLM_OTEL_INTEGRATION_ENABLE_METRICS: "true"
      # Body-less exception events fail in the pinned OTLP encoder. Revisit
      # https://github.com/BerriAI/litellm/issues/36863 before enabling them.
      LITELLM_OTEL_LEGACY_COMPAT: "false"
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: no_content
      OTEL_SERVICE_NAME: lgos-litellm
    depends_on:
      lgos-otel-collector:
        condition: service_started
