services:
  lgos-openwebui:
    container_name: lgos-openwebui
    image: $DEMO_OPENWEBUI_IMAGE
    restart: "no"
    user: "$PUID:$PGID"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=$PUID,gid=$PGID,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=32m,uid=$PUID,gid=$PGID,mode=775
      - /app/backend/open_webui/static:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    ports:
      - "$LGOS_OPENWEBUI_PORT:8080"
    volumes:
      - type: bind
        source: ../volumes/open-webui
        target: /app/backend/data
        bind:
          create_host_path: false
    environment:
      ENABLE_PERSISTENT_CONFIG: false
      WEBUI_NAME: LGOS-OpenWebUI
      WEBUI_SECRET_KEY: $DEMO_OPENWEBUI_SECRET_KEY
      # Per-model access control needs stored model records, which LGOS models
      # lack; the gateway's model list for each credential decides instead.
      BYPASS_MODEL_ACCESS_CONTROL: true
      ENABLE_OLLAMA_API: false
      ENABLE_TITLE_GENERATION: false
      ENABLE_FOLLOW_UP_GENERATION: false
      ENABLE_TAGS_GENERATION: false
      ENABLE_PIP_INSTALL_FRONTMATTER_REQUIREMENTS: false
      OFFLINE_MODE: true
      # Open WebUI creates this admin only in an empty database. The sync signs
      # in with it, or with an admin's API key where password sign-in is off.
      WEBUI_ADMIN_EMAIL: $DEMO_OPENWEBUI_ADMIN_EMAIL
      WEBUI_ADMIN_PASSWORD: $DEMO_OPENWEBUI_ADMIN_PASSWORD
      WEBUI_ADMIN_NAME: LGOS
      ENABLE_API_KEYS: true
      # Read at every start; with persistent config disabled, admin edits last
      # only until restart. Models advertising mcp_tools attach this connection ID.
      TOOL_SERVER_CONNECTIONS: >-
        [{"type": "mcp", "url": "${OPENAI_GATEWAY_BASE_URL}/mcp", "path": "",
        "auth_type": "bearer", "key": "$OPENAI_GATEWAY_API_KEY",
        "config": {"enable": true, "function_name_filter_list": [],
        "access_grants": [{"principal_type": "user", "principal_id": "*", "permission": "read"}]},
        "info": {"id": "lgos-gateway", "name": "LGOS Gateway",
        "description": "MCP tools authorized by the configured gateway key."}}]
      # Serves every other gateway model; the image's exclude_model_ids leaves
      # out the lgos/ ones, which the Generic Pipe serves. The Pipe and speech
      # authenticate like this connection, which the SSO overlay switches to
      # system_oauth.
      ENABLE_OPENAI_API: true
      OPENAI_API_BASE_URL: ${OPENAI_GATEWAY_BASE_URL}/v1
      OPENAI_API_KEY: $OPENAI_GATEWAY_API_KEY
      OPENAI_API_CONFIGS: '{"0": {"auth_type": "bearer", "exclude_model_ids": ["lgos/*"]}}'
      ENABLE_IMAGE_GENERATION: false
      # The image keeps chat uploads raw; the central Files API processes them.
      ENABLE_FILE_UPLOAD_PROCESSING: false
      # Both gateways serve OpenAI speech under /v1. Audio base URLs do not
      # inherit any other connection setting.
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_OPENAI_API_BASE_URL: ${OPENAI_GATEWAY_BASE_URL}/v1
      AUDIO_STT_OPENAI_API_KEY: $OPENAI_GATEWAY_API_KEY
      AUDIO_STT_MODEL: $DEMO_AUDIO_STT_MODEL
      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_OPENAI_API_BASE_URL: ${OPENAI_GATEWAY_BASE_URL}/v1
      AUDIO_TTS_OPENAI_API_KEY: $OPENAI_GATEWAY_API_KEY
      AUDIO_TTS_MODEL: $DEMO_AUDIO_TTS_MODEL
      AUDIO_TTS_VOICE: $DEMO_AUDIO_TTS_VOICE
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
