services:
  lgos-bifrost:
    container_name: lgos-bifrost
    image: maximhq/bifrost:v2.0.0@sha256:cf71be9fad4e0749b6e26cbb774c687413dad9a0970b83f4e1dadb6f503ea208
    restart: "no"
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=${PUID:-1000},gid=${PGID:-1000},mode=1777
      - /run:rw,noexec,nosuid,nodev,size=32m,uid=${PUID:-1000},gid=${PGID:-1000},mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    depends_on:
      lgos-demo-api-a:
        condition: service_healthy
      lgos-demo-api-b:
        condition: service_healthy
      lgos-files-api:
        condition: service_healthy
    ports:
      - "3000:4000"
    volumes:
      - type: bind
        source: ../volumes/bifrost
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ../configs/bifrost/config.json
        target: /app/data/config.json
        read_only: true
        bind:
          create_host_path: false
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 4000
      LOG_LEVEL: info
      LOG_STYLE: json
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:4000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
