services:
  lgos-bifrost:
    container_name: lgos-bifrost
    profiles: [bifrost]
    image: maximhq/bifrost:v2.1.1@sha256:9e65eb4d0b292c25aaf46d194c705344f19c833a29e30155038bbe551eac7245
    restart: "no"
    user: "$PUID:$PGID"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=32m,uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    depends_on:
      lgos-postgres-mcp:
        condition: service_healthy
      lgos-demo-api-a:
        condition: service_healthy
      lgos-demo-api-b:
        condition: service_healthy
      lgos-files-api:
        condition: service_healthy
    ports:
      - "$LGOS_GATEWAY_PORT:4000"
    volumes:
      - type: bind
        source: ../volumes/bifrost
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ../configs/bifrost/config.json
        target: /app/data/config.json
        read_only: true
        bind:
          create_host_path: false
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 4000
      LOG_LEVEL: info
      LOG_STYLE: json
      BIFROST_DEMO_VIRTUAL_KEY: $OPENAI_GATEWAY_API_KEY
      LGOS_MCP_AUTH_HEADER: Bearer $LGOS_MCP_AUTH_TOKEN
    # Bifrost 2.1.1 reconciles file-defined Virtual MCPs before file-defined
    # virtual keys on first boot. Repeat the idempotent assignment once its API
    # is ready, then keep the service unhealthy until the assignment is visible.
    post_start:
      - command:
          - sh
          - -ec
          - |
            attempt=0
            until wget --quiet --tries=1 --timeout=2 \
              --output-document=/dev/null --post-data='' \
              http://localhost:4000/api/mcp/virtual-mcps/1/virtual-keys/lgos-demo
            do
              attempt=$$((attempt + 1))
              [ "$$attempt" -lt 30 ] || exit 1
              sleep 1
            done
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget --quiet --tries=1 --output-document=/dev/null http://localhost:4000/health &&
          wget --quiet --tries=1 --output-document=- http://localhost:4000/api/mcp/virtual-mcps/1 |
          grep -q '"lgos-demo"'
      interval: 5s
      timeout: 5s
      retries: 10
