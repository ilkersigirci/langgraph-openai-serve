services:
  lgos-chainlit:
    container_name: lgos-chainlit
    image: ghcr.io/ilkersigirci/lgos-chainlit:$DEMO_IMAGE_TAG
    pull_policy: always
    restart: "no"
    user: "$PUID:$PGID"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=32m,uid=$PUID,gid=$PGID,mode=775
      - /app/src/lgos_chainlit/.files:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=755
      - /app/src/lgos_chainlit/.chainlit/translations:rw,noexec,nosuid,nodev,size=16m,uid=$PUID,gid=$PGID,mode=755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    depends_on:
      lgos-db:
        condition: service_healthy
    pre_start:
      - command: ["lgos-chainlit-setup"]
    ports:
      - "$LGOS_CHAINLIT_PORT:5000"
    environment:
      CHAINLIT_APP_ROOT: /app/src/lgos_chainlit
      CHAINLIT_AUTH_SECRET: $CHAINLIT_AUTH_SECRET
      DATABASE_URL: postgresql://lgos:lgos@lgos-db:5432/lgos
      BUCKET_NAME: $BUCKET_NAME
      APP_AWS_ACCESS_KEY: $APP_AWS_ACCESS_KEY
      APP_AWS_SECRET_KEY: $APP_AWS_SECRET_KEY
      APP_AWS_REGION: $APP_AWS_REGION
      DEV_AWS_ENDPOINT: $DEV_AWS_ENDPOINT
      STORAGE_EXPIRY_TIME: $STORAGE_EXPIRY_TIME
      OPENAI_GATEWAY_TYPE: $OPENAI_GATEWAY_TYPE
      OPENAI_GATEWAY_BASE_URL: $OPENAI_GATEWAY_BASE_URL
      DEMO_CHAINLIT_GATEWAY_API_KEY: $DEMO_CHAINLIT_GATEWAY_API_KEY
      DEMO_CHAINLIT_ENABLE_OAUTH_TOKEN_FORWARDING: $DEMO_CHAINLIT_ENABLE_OAUTH_TOKEN_FORWARDING
      CHAINLIT_UTILS_MIGRATIONS_TABLE: $CHAINLIT_UTILS_MIGRATIONS_TABLE
      CHAINLIT_UTILS_MODEL_CONTEXT_EXCLUDED_KEY: $CHAINLIT_UTILS_MODEL_CONTEXT_EXCLUDED_KEY
      DEMO_CHAINLIT_HITL_MODEL: $DEMO_CHAINLIT_HITL_MODEL
      DEMO_CHAINLIT_LOGIN_TYPE: $DEMO_CHAINLIT_LOGIN_TYPE
      DEMO_CHAINLIT_UI_FILE: $DEMO_CHAINLIT_UI_FILE
      DEMO_CHAINLIT_OAUTH_ISSUER: $DEMO_CHAINLIT_OAUTH_ISSUER
      DEMO_CHAINLIT_OAUTH_RESOURCE: $DEMO_CHAINLIT_OAUTH_RESOURCE
      DEMO_CHAINLIT_OAUTH_CLIENT_AUTH_METHOD: $DEMO_CHAINLIT_OAUTH_CLIENT_AUTH_METHOD
      DEMO_CHAINLIT_OAUTH_ENCRYPTION_KEYS: $DEMO_CHAINLIT_OAUTH_ENCRYPTION_KEYS
      CHAINLIT_URL: $CHAINLIT_URL
      OAUTH_GENERIC_CLIENT_ID: $OAUTH_GENERIC_CLIENT_ID
      OAUTH_GENERIC_CLIENT_SECRET: $OAUTH_GENERIC_CLIENT_SECRET
      OAUTH_GENERIC_SCOPES: $OAUTH_GENERIC_SCOPES
      OAUTH_GENERIC_NAME: $OAUTH_GENERIC_NAME
      OAUTH_PROMPT: $OAUTH_PROMPT
      OAUTH_GENERIC_PROMPT: $OAUTH_GENERIC_PROMPT
      ## HITL ##
      # DEMO_CHAINLIT_UI_FILE: hitl
      # DEMO_CHAINLIT_HITL_MODEL: lgos-a/interruptible-approval
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
