services:
  lgos-chainlit:
    container_name: lgos-chainlit
    image: ghcr.io/ilkersigirci/lgos-chainlit:${DEMO_IMAGE_TAG:-latest}
    pull_policy: always
    restart: "no"
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=${PUID:-1000},gid=${PGID:-1000},mode=1777
      - /run:rw,noexec,nosuid,nodev,size=32m,uid=${PUID:-1000},gid=${PGID:-1000},mode=775
      - /app/src/lgos_chainlit/.files:rw,noexec,nosuid,nodev,size=64m,uid=${PUID:-1000},gid=${PGID:-1000},mode=755
      - /app/src/lgos_chainlit/.chainlit/translations:rw,noexec,nosuid,nodev,size=16m,uid=${PUID:-1000},gid=${PGID:-1000},mode=755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: 1G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    depends_on:
      lgos-db:
        condition: service_healthy
      lgos-bifrost:
        condition: service_healthy
    pre_start:
      - command: ["lgos-chainlit-setup"]
    ports:
      - "3002:5000"
    env_file:
      - path: ../../.env
        required: false
    environment:
      CHAINLIT_APP_ROOT: /app/src/lgos_chainlit
      DATABASE_URL: postgresql://lgos:lgos@lgos-db:5432/lgos
      BUCKET_NAME: ${BUCKET_NAME:?Configure BUCKET_NAME for Chainlit elements}
      APP_AWS_ACCESS_KEY: ${APP_AWS_ACCESS_KEY:?Configure APP_AWS_ACCESS_KEY}
      APP_AWS_SECRET_KEY: ${APP_AWS_SECRET_KEY:?Configure APP_AWS_SECRET_KEY}
      APP_AWS_REGION: ${APP_AWS_REGION:?Configure APP_AWS_REGION}
      DEV_AWS_ENDPOINT: ${DEV_AWS_ENDPOINT:?Configure DEV_AWS_ENDPOINT}
      STORAGE_EXPIRY_TIME: ${STORAGE_EXPIRY_TIME:-3600}
      # Raw pass-through preserves LGOS metadata and extension-only stream chunks.
      DEMO_CHAINLIT_OPENAI__BASE_URL: ${DEMO_BIFROST_BASE_URL:-http://lgos-bifrost:8080}/openai_passthrough/v1
      DEMO_CHAINLIT_OPENAI__CATALOG_BASE_URL: ${DEMO_BIFROST_BASE_URL:-http://lgos-bifrost:8080}/v1
      # DEMO_CHAINLIT_OPENAI__BASE_URL: http://lgos-bifrost:8080/openai/v1 # NOTE: For testing the limited functionality
      DEMO_CHAINLIT_OPENAI__API_KEY: DUMMY
      DEMO_CHAINLIT_HITL_MODEL: lgos-a/interruptible-approval
      # DEMO_CHAINLIT_UI_FILE: hitl # NOTE: To select HITL chainlit file
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
