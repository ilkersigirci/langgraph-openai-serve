x-lgos-package-environment: &lgos-package-environment
  LGOS_OPENAI_API_DOCS_ENABLED: $LGOS_OPENAI_API_DOCS_ENABLED

x-lgos-demo-api-environment: &lgos-demo-api-environment
  <<: *lgos-package-environment
  DEMO_API_PORT: 8000
  DEMO_API_POSTGRES_URI: postgresql://lgos:lgos@lgos-db:5432/lgos
  DEMO_API_OPENAI_BASE_URL: $DEMO_API_OPENAI_BASE_URL
  DEMO_API_OPENAI_API_KEY: $DEMO_API_OPENAI_API_KEY
  DEMO_API_OPENAI_MODEL: $DEMO_API_OPENAI_MODEL
  DEMO_API_OPENAI_EMBEDDING_MODEL: $DEMO_API_OPENAI_EMBEDDING_MODEL
  DEMO_API_FILES_BASE_URL: http://lgos-files-api:8000/v1
  LANGFUSE_BASE_URL: $LANGFUSE_BASE_URL
  LANGFUSE_PUBLIC_KEY: $LANGFUSE_PUBLIC_KEY
  LANGFUSE_SECRET_KEY: $LANGFUSE_SECRET_KEY
  LGOS_ENABLE_LANGFUSE: $LGOS_ENABLE_LANGFUSE
  LGOS_OPENAI_API_PREFIX: $LGOS_OPENAI_API_PREFIX
  LANGGRAPH_STRICT_MSGPACK: $LANGGRAPH_STRICT_MSGPACK

x-lgos-demo-api: &lgos-demo-api
  image: ghcr.io/ilkersigirci/lgos-demo-api:$DEMO_IMAGE_TAG
  pull_policy: always
  restart: "no"
  user: "$PUID:$PGID"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
    - /run:rw,noexec,nosuid,nodev,size=32m,uid=$PUID,gid=$PGID,mode=775
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add: []
  pids_limit: 256
  cpus: "1.0"
  mem_limit: 1G
  ulimits:
    nofile:
      soft: 4096
      hard: 8192
  environment:
    <<: *lgos-demo-api-environment
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health', timeout=2)"]
    interval: 5s
    timeout: 5s
    retries: 10

services:
  lgos-demo-api-a:
    <<: *lgos-demo-api
    container_name: lgos-demo-api-a
    depends_on:
      lgos-demo-api-setup:
        condition: service_completed_successfully
    ports:
      - "3004:8000"

  lgos-demo-api-b:
    <<: *lgos-demo-api
    container_name: lgos-demo-api-b
    depends_on:
      lgos-demo-api-setup:
        condition: service_completed_successfully
    ports:
      - "3005:8000"

  lgos-demo-api-setup:
    <<: *lgos-demo-api
    container_name: lgos-demo-api-setup
    command: ["lgos-demo-api-setup"]
    depends_on:
      lgos-db:
        condition: service_healthy
    healthcheck:
      disable: true
