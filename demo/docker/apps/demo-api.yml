x-lgos-package-environment: &lgos-package-environment
  LGOS_OPENAI_API_DOCS_ENABLED: $LGOS_OPENAI_API_DOCS_ENABLED

x-lgos-demo-api-environment: &lgos-demo-api-environment
  <<: *lgos-package-environment
  LGOS_CORS_ORIGINS: $LGOS_CORS_ORIGINS
  LGOS_POSTGRES_URI: postgresql://lgos:lgos@lgos-db:5432/lgos
  LGOS_INTERRUPT_TTL_MINUTES: $LGOS_INTERRUPT_TTL_MINUTES
  LGOS_INTERRUPT_SWEEP_INTERVAL_MINUTES: $LGOS_INTERRUPT_SWEEP_INTERVAL_MINUTES
  LGOS_BACKGROUND: $LGOS_BACKGROUND
  LGOS_HATCHET_WORKER_SLOTS: $LGOS_HATCHET_WORKER_SLOTS
  OPENAI_GATEWAY_BASE_URL: $OPENAI_GATEWAY_BASE_URL
  OPENAI_GATEWAY_API_KEY: $OPENAI_GATEWAY_API_KEY
  DEMO_API_OPENAI_CHAT_COMPLETIONS_MODEL: $DEMO_API_OPENAI_CHAT_COMPLETIONS_MODEL
  DEMO_API_OPENAI_RESPONSES_MODEL: $DEMO_API_OPENAI_RESPONSES_MODEL
  DEMO_API_VECTOR_STORE_ID: $DEMO_API_VECTOR_STORE_ID
  DEMO_API_OPENAI_EMBEDDING_MODEL: $DEMO_API_OPENAI_EMBEDDING_MODEL
  DEMO_API_WEB_SEARCH_BACKEND: $DEMO_API_WEB_SEARCH_BACKEND
  DEMO_API_WEB_SEARCH_URL: $DEMO_API_WEB_SEARCH_URL
  DEMO_API_FILES_BASE_URL: http://lgos-files-api:8000/v1
  HATCHET_CLIENT_TOKEN: $HATCHET_CLIENT_TOKEN
  HATCHET_CLIENT_NAMESPACE: $HATCHET_CLIENT_NAMESPACE
  HATCHET_CLIENT_OPENTELEMETRY_EXCLUDED_ATTRIBUTES: $HATCHET_CLIENT_OPENTELEMETRY_EXCLUDED_ATTRIBUTES
  LANGFUSE_BASE_URL: $LANGFUSE_BASE_URL
  LANGFUSE_PUBLIC_KEY: $LANGFUSE_PUBLIC_KEY
  LANGFUSE_SECRET_KEY: $LANGFUSE_SECRET_KEY
  LGOS_ENABLE_LANGFUSE: $LGOS_ENABLE_LANGFUSE
  LANGGRAPH_STRICT_MSGPACK: $LANGGRAPH_STRICT_MSGPACK

x-lgos-demo-api: &lgos-demo-api
  image: ghcr.io/ilkersigirci/lgos-demo-api:$DEMO_IMAGE_TAG
  pull_policy: always
  restart: "no"
  user: "$PUID:$PGID"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
    - /run:rw,noexec,nosuid,nodev,size=32m,uid=$PUID,gid=$PGID,mode=775
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add: []
  pids_limit: 256
  cpus: "1.0"
  mem_limit: 1G
  ulimits:
    nofile:
      soft: 4096
      hard: 8192
  environment:
    <<: *lgos-demo-api-environment
  healthcheck: &lgos-demo-api-healthcheck
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health', timeout=2)"]
    start_period: 60s
    interval: 5s
    timeout: 5s
    retries: 10

services:
  lgos-demo-api-a:
    <<: *lgos-demo-api
    container_name: lgos-demo-api-a
    depends_on:
      lgos-db:
        condition: service_healthy
    ports:
      - "$LGOS_A_PORT:8000"

  lgos-demo-api-b:
    <<: *lgos-demo-api
    container_name: lgos-demo-api-b
    depends_on:
      lgos-db:
        condition: service_healthy
    ports:
      - "$LGOS_B_PORT:8000"

  lgos-background-worker:
    <<: *lgos-demo-api
    profiles: [background]
    container_name: lgos-background-worker
    command: ["lgos", "worker"]
    depends_on:
      lgos-db:
        condition: service_healthy
    healthcheck:
      <<: *lgos-demo-api-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]

  lgos-model-sync:
    <<: *lgos-demo-api
    profiles: [model-sync]
    environment:
      LITELLM_MASTER_KEY: $LITELLM_MASTER_KEY
    healthcheck:
      disable: true
    entrypoint:
      - lgos-demo-api-sync-litellm
      - --gateway-url
      - $LITELLM_SYNC_BASE_URL
