services:
  lgos-db:
    container_name: lgos-db
    image: postgres:18.4-alpine3.23
    restart: "no"
    user: "$PUID:$PGID"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=32m,uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    mem_limit: 2G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    ports:
      - "$LGOS_DB_PORT:5432"
    volumes:
      - type: bind
        source: ../volumes/lgos-db
        target: /var/lib/postgresql
        bind:
          create_host_path: false
    environment:
      POSTGRES_USER: lgos
      POSTGRES_PASSWORD: lgos
      POSTGRES_DB: lgos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lgos -d lgos"]
      interval: 5s
      timeout: 5s
      retries: 5

  lgos-mcp-db-setup:
    container_name: lgos-mcp-db-setup
    image: postgres:18.4-alpine3.23
    restart: "no"
    user: "$PUID:$PGID"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=$PUID,gid=$PGID,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    depends_on:
      lgos-db:
        condition: service_healthy
      lgos-demo-api-setup:
        condition: service_completed_successfully
      lgos-chainlit-setup:
        condition: service_completed_successfully
    command:
      - psql
      - --host=lgos-db
      - --username=lgos
      - --dbname=lgos
      - --file=/config/mcp-readonly.sql
    environment:
      LGOS_MCP_DB_PASSWORD: $LGOS_MCP_DB_PASSWORD
      PGPASSWORD: lgos
    volumes:
      - type: bind
        source: ../configs/postgres/mcp-readonly.sql
        target: /config/mcp-readonly.sql
        read_only: true
        bind:
          create_host_path: false

  lgos-postgres-mcp:
    container_name: lgos-postgres-mcp
    image: bytebase/dbhub:1.2.3@sha256:8fbdf3f579b7eb2701c32d895447e35f61b24e6c2505b0fcfd34e314bdf9f5db
    restart: "no"
    user: "$PUID:$PGID"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=$PUID,gid=$PGID,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 128
    cpus: "0.5"
    mem_limit: 512M
    depends_on:
      lgos-mcp-db-setup:
        condition: service_completed_successfully
    environment:
      LGOS_MCP_DB_PASSWORD: $LGOS_MCP_DB_PASSWORD
      DBHUB_AUTH_TOKEN: $LGOS_MCP_AUTH_TOKEN
      DBHUB_ALLOWED_HOSTS: lgos-postgres-mcp
    command:
      - --config=/config/dbhub.toml
      - --transport=http
      - --host=0.0.0.0
      - --port=8080
    volumes:
      - type: bind
        source: ../configs/postgres/dbhub.toml
        target: /config/dbhub.toml
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 6
