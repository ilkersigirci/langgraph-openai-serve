services:
  lgos-litellm:
    container_name: lgos-litellm
    profiles: [litellm]
    image: $DEMO_LITELLM_IMAGE
    restart: "no"
    user: "$PUID:$PGID"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=$PUID,gid=$PGID,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=32m,uid=$PUID,gid=$PGID,mode=775
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: []
    pids_limit: 256
    cpus: "1.0"
    # LiteLLM's Prisma migration and proxy initialization overlap briefly and
    # exceed 2 GiB on a fresh Admin UI database.
    mem_limit: 3G
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    depends_on:
      lgos-db:
        condition: service_healthy
      lgos-demo-api-a:
        condition: service_healthy
      lgos-demo-api-b:
        condition: service_healthy
      lgos-files-api:
        condition: service_healthy
    environment:
      CONFIG_FILE_PATH: /app/config.yaml
      DATABASE_URL: postgresql://lgos:lgos@lgos-db:5432/lgos?schema=litellm
      LITELLM_MASTER_KEY: $OPENAI_GATEWAY_API_KEY
      STORE_MODEL_IN_DB: "true"
      STORE_PROMPTS_IN_SPEND_LOGS: "true"
      OPENAI_BASE_URL: http://lgos-files-api:8000/v1
      OPENAI_API_KEY: DUMMY
      ##### CUSTOM IMAGE #####
      # Honor each deployment's native Responses streaming capability.
      LITELLM_ENABLE_RESPONSES_STREAMING_FIX: "true"
    # Initialize the Admin UI database through the image's proxy CLI.
    command:
      - --config
      - /app/config.yaml
      - --host
      - 0.0.0.0
      - --port
      - "4000"
      - --use_v2_migration_resolver
      - --enforce_prisma_migration_check
    ports:
      - "$LGOS_GATEWAY_PORT:4000"
    volumes:
      - type: bind
        source: ../configs/litellm/config.yaml
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 12
