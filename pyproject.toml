[project]
name = "langgraph_openai_serve"
version = "0.0.1"
description = "Openai Compatible Langgraph Server"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    {name = "İlker SIĞIRCI", email = "sigirci.ilker@gmail.com"},
]
maintainers = [
    {name = "İlker SIĞIRCI", email = "sigirci.ilker@gmail.com"},
]

keywords = [
    "langgraph_openai_serve"
]

classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "anyio>=4,<5",
    "fastapi[standard]>=0.121.0",
    "langgraph>=1.1.10,<2.0.0",
    "openai>=2.0.0,<3.0.0",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9.0",
]

[project.optional-dependencies]
postgres = [
    "langgraph-checkpoint-postgres>=3.1.0,<4",
    "psycopg>=3.3.4,<4",
    "psycopg-pool>=3.3.0,<4",
]
tracing = [
    "langchain>=1.2.0",
    "langfuse>=4.0.0,<5.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "prek>=0.3.11",
    "ruff>=0.16.3",
    "ty>=0.0.72",
]
doc = [
    # Zensical uses its mike fork as the versioning bridge until native support:
    # https://zensical.org/docs/setup/versioning/
    "mike @ git+https://github.com/squidfunk/mike.git@2d4ad799442f4592db8ad53b179bfb33db8c69ac",
    "mkdocstrings-python>=2.0.0",
    "zensical>=0.0.11",
]
test = [
    "anyio>=4.14,<5",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.1",
    "pytest>=8.3.3",
    "langgraph-checkpoint-sqlite>=3.1.0,<4",
    "psycopg[binary,pool]>=3.3.4,<4",
    "pytest-env>=1.6.0",
]
[tool.uv]
default-groups = ["dev", "doc", "test"]
required-version = "==0.12.1"

[tool.pytest.ini_options]
minversion = "8.3.3"
anyio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "--color=yes",
    "--strict-config",
    "--strict-markers",
]

env = ["ENVIRONMENT=test", "LGOS_ENABLE_LANGFUSE=False"]

testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]
respect-gitignore = true

extend-exclude = [
    "docs",
]

# Ignore `E402` (import violations) in all `__init__.py` files, and in `path/to/file.py`.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
"*.ipynb" = ["ERA001", "T201", "ANN"]
"tests/*" = ["INP001", "ARG001", "ARG002", "ARG005", "S101", "S105", "S106", "S107", "SLF001", "ANN", "FBT"]
"demo/*/tests/*" = ["INP001", "ARG001", "ARG002", "ARG005", "S101", "S105", "S106", "S107", "SLF001", "ANN", "FBT", "PLC0415"]
"demo/*" = ["S104", "T201", "PLC0415"]
"src/langgraph_openai_serve/core/settings.py" = ["FBT001"]

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.ruff.lint]

select = [
    "A", # flake8-builtins
    "ANN", # flake8-annotations
    "ARG", # flake8-unused-arguments
    "ASYNC", # async
    "B",  # flake8-bugbear
    "BLE", # flake8-blind-except
    "C",  # flake8-comprehensions
    "C9",  # mccabe
    "DTZ", # flake8-datetimez
    "E",  # pycodestyle errors (default)
    "ERA", # eradicate
    "EXE", # flake8-executable
    "F",  # pyflakes (default)
    "FA", # flake8-future-annotations
    "FAST", # fastapi
    "FBT", # flake8-boolean-trap
    "FIX", # flake8-fixme
    "FLY", # flynt
    "FURB", # refurb
    "I",  # isort
    "ICN", # flake8-import-conventions
    "INP", # flake8-no-pep420
    "ISC", # flake8-implicit-str-concat
    "LOG", # flake8-logging
    "N", # pep8-naming
    "PD", # pandas-vet
    "PERF", # perflint
    "PGH", # pygrep-hooks
    "PIE", # pie
    "PL",  # pylint
    "PLC", # pylint convention
    "PLE", # pylint error
    "PLW", # pylint warning
    "PT", # flake8-pytest-style
    "PTH", # pathlib
    "PYI", # flake8-pyi
    "Q",  # flake8-quotes
    "RET", # return
    "RSE", # flake8-raise
    "RUF", # Enable all ruff-specific checks
    "S",   # flake8-bandit
    "S307", # eval
    "SIM", # simplify
    "SLF", # flake8-self
    "SLOT", # flake8-slots
    "T10", # flake8-debugger
    "T20", # flake8-print
    "TC", # flake8-type-checking
    "TD", # flake8-todos
    "TID", # flake8-tidy-imports
    "UP", # pyupgrade
    "W",  # pycodestyle warnings
    "YTT", # flake8-2020
]

ignore = [
    "E501",  # Line too long, handled by ruff formatter
    "D107", # "Missing docstring in __init__",
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
]

unfixable = [
    "F401" # Unused imports.
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.coverage.run]
source = ['src/langgraph_openai_serve']
branch = true
context = '${CONTEXT}'

[tool.coverage.report]
precision = 2
exclude_lines = [
    'pragma: no cover',
    'raise NotImplementedError',
    'if TYPE_CHECKING:',
    '@overload',
]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.1,<0.13"]
