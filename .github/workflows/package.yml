name: Publish to PyPI

on:
  release:
    types:
      - published

permissions: {}

jobs:
  build-distributions:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate release
        id: release
        uses: $/demo/.github/actions/validate-release
        with:
          tag: ${{ github.event.release.tag_name }}
          prerelease: ${{ github.event.release.prerelease }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Update version in pyproject.toml
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          echo "Using version: $VERSION"

          uv version --frozen "$VERSION"

      - name: Build source and wheel distributions
        run: uv build --out-dir dist

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: |
            dist/*.tar.gz
            dist/*.whl
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs: [build-distributions]
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/langgraph-openai-serve
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Publish to PyPI
        run: uv publish
