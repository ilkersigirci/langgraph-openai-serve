name: Deploy Docs to GitHub Pages

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, for example v0.8.1 or v0.9.0-rc1
        required: true
        type: string
      prerelease:
        description: Whether the release tag is a prerelease
        required: true
        default: false
        type: boolean

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Validate release
        id: release
        uses: $/demo/.github/actions/validate-release
        with:
          tag: ${{ github.event.release.tag_name || inputs.release_tag }}
          prerelease: ${{ github.event_name == 'release' && github.event.release.prerelease == true || github.event_name == 'workflow_dispatch' && inputs.prerelease == true }}

      - name: Checkout release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install documentation dependencies
        run: uv sync --frozen --only-group doc

      - name: Configure deployment commit author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish version
        env:
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            uv run mike deploy \
              --push \
              --title "$VERSION" \
              "$VERSION"
          else
            uv run mike deploy \
              --push \
              --update-aliases \
              --alias-type redirect \
              --title "$VERSION" \
              "$VERSION" \
              latest
            uv run mike set-default --push latest
          fi

  deploy:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Checkout assembled site
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: public
          persist-credentials: false
          ref: gh-pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
