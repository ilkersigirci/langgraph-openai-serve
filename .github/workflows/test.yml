name: Test package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  base_install:
    name: Test base installation without PostgreSQL
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          resolution-strategy: lowest
          python-version: "3.13"

      - name: Build and test the base installation
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/dist"
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project \
            --with "$RUNNER_TEMP"/dist/*.whl \
            python "$GITHUB_WORKSPACE/tests/base_install_smoke.py"

  test_matrix:
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          resolution-strategy: lowest
          python-version: ${{ matrix.python-version }}

      - name: Install the project with test dependencies
        run: uv sync --frozen --only-group test

      - name: Test the project
        run: just test -n auto

  dependency_floors:
    name: Test the minimum supported dependencies
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          resolution-strategy: lowest
          python-version: "3.11"

      # Resolve each direct dependency, extras included, to its declared floor.
      - name: Test against the dependency floors
        run: |
          uv run --resolution lowest-direct --all-extras \
            --no-default-groups --group test --module pytest -n auto
